function fit(){
  const tw=n=>{const r=document.createRange();r.selectNodeContents(n);return r.getBoundingClientRect().width};

    const w=Math.max(...labs.flatMap(l=>[tw(l.firstChild),tw(l.querySelector('small'))]));

    c.style.setProperty('--lab','135px');

  }
}

  // ARCHIVE 是 sticky（top:40px），页面顶部时已被顶到距屏幕顶 40px 处；以页面顶部（未滚动）时的位置为准
  const hist=document.querySelector('.hist');
  const archTop=Math.max(top(document.querySelector('.page')),parseFloat(getComputedStyle(hist).top)||0)+arch.offsetTop;
  sub.style.marginBottom=(28+archTop-top(leg))+'px';       // 整块（图例 + 图）下移，让图例顶边 = ARCHIVE 顶边
  const d=top(sp[0])-archTop;                              // 纳指100 数值行与图例顶边相差的零头
  sp.forEach(e=>e.style.bottom=(4+d)+'px');
}
const fitAll=()=>{fit();alignTop()};
fitAll();addEventListener('resize',fitAll);document.fonts&&document.fonts.ready.then(fitAll);
document.getElementById('n').innerHTML=`说明：<br>1. 横轴上限 ${CAP} 倍。超出部分截断（斜断口），实际值标在柱外右侧。<br>2. 前瞻市盈率高于滚动市盈率时（谷歌、亚马逊），浅色柱画在深色柱上方：浅色段是滚动值，露出的深色段末端是前瞻值。<br>3. 纳指100 整体市盈率 = 成分股总市值 ÷ 总盈利（各股盈利 = 市值 ÷ 市盈率），按 finviz 列出的 ${D.n} 只成分计算，市值加权，非 QQQ 权重。亏损或无数据的成分不计入：滚动口径剔除 ${D.ex_pe} 只，前瞻口径剔除 ${D.ex_fpe} 只（含 SpaceX）。<br>4. 「其他」= 前 33 名以外成分的同口径汇总，权重 = 100% − 前 33 名权重之和。${D.rows.some(r=>r.href)?'<br>5. 蓝绿色的代码可点击，打开研报知识库中该标的的页面（谷歌 A / C 共用一页）。':''}<br>${D.rows.some(r=>r.href)?6:5}. CrowdStrike 滚动市盈率 7,426 倍、Palo Alto 791 倍，因 TTM 盈利接近零，不代表估值水平。`;
