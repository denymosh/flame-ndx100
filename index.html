/* 与 sicaper.net 导航页一致的终端风格：白底 + 浅青网格 + 青色强调 + 缓慢下扫的扫描线 */
:root{--bg:#f4f8fb;--fg:#0b2a35;--muted:#5c7885;--grid:rgba(8,110,135,.20);--fwd:#0e7490;--ttm:#a8e4ef;--line:#0a8fa9;--ttmtxt:#06303a;--acc:#0a7f99;--ink:#06303a;--fwdtxt:#0e7490;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;--display:"Zen Dots","PingFang SC","Microsoft YaHei",sans-serif}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background-image:linear-gradient(rgba(8,145,178,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(8,145,178,.09) 1px,transparent 1px);background-size:40px 40px}
/* 左上、右下两团淡青光晕 */
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 420px at 18% -6%,rgba(8,145,178,.14),transparent 70%),radial-gradient(700px 360px at 100% 100%,rgba(8,145,178,.08),transparent 70%)}
/* 每 9 秒从上到下扫过一次的细扫描线 */
.sweep{position:fixed;left:0;right:0;top:0;height:2px;pointer-events:none;z-index:5;background:linear-gradient(90deg,transparent,rgba(8,145,178,.55),transparent);box-shadow:0 0 16px 2px rgba(8,145,178,.25);animation:sweep 9s linear infinite}
@keyframes sweep{from{transform:translateY(-10px)}to{transform:translateY(100vh)}}
@media (prefers-reduced-motion:reduce){.sweep{display:none}}
a{color:inherit}
.boot{font-family:var(--mono);color:var(--muted);font-size:13px;line-height:1.9}
.boot a{color:var(--acc);text-decoration:none}.boot a:hover{text-decoration:underline}
.boot b{color:var(--acc);font-weight:400}
.ttl{font-size:17px;font-weight:600;color:var(--ink);margin:2px 0 4px}
footer{margin-top:40px;font-family:var(--display);font-size:10px;letter-spacing:.2em;color:var(--muted)}
.page{display:flex;justify-content:center}
.wrap{flex:0 1 900px;min-width:0;max-width:900px;padding:20px 16px 32px;box-sizing:border-box}
.hist{flex:none;width:112px;margin:0 128px 0 -64px;position:sticky;top:40px;align-self:flex-start;padding:200px 0 0 16px;font-size:13px;font-family:var(--mono)}
.hist .ht{font-family:var(--display);color:var(--muted);font-size:10px;letter-spacing:.2em;margin-bottom:8px}
.hist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.hist a{color:var(--acc);text-decoration:none;white-space:nowrap}
.hist a:hover{text-decoration:underline}
.hist a[aria-current]{color:var(--ink)}.hist a[aria-current]:before{content:"▸ ";color:var(--acc)}
@media (max-width:1240px){.hist{margin-left:0;margin-right:64px}}
@media (max-width:760px){.page{flex-direction:column}.hist{position:static;width:auto;margin-right:0;padding:12px 16px 0;display:flex;gap:10px;align-items:baseline}.hist .ht{margin:0}.hist ul{flex-direction:row;flex-wrap:wrap;gap:4px 12px}}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);letter-spacing:.05em;margin:10px 0 6px;color:var(--ink);text-shadow:3px 3px 0 rgba(8,145,178,.22)}
h1 i{display:inline-block;width:.5em;height:.85em;background:var(--acc);vertical-align:-.06em;margin-left:.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){h1 i{animation:none}}
.sub{font-family:var(--mono);color:var(--muted);font-size:12px;margin-bottom:28px;line-height:1.7}
.legend{display:flex;flex-direction:column;align-items:flex-end;gap:3px;position:relative;z-index:2;margin-bottom:-84px}
.legend .lg{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;width:270px;padding:3px 8px;box-sizing:border-box;font-size:20px;line-height:1.2}
.legend .lg small{font-size:14px}
.legend .lg.t{background:var(--ttm);color:var(--ink)}
.legend .lg.f{background:var(--fwd);color:#fff}
.legend .ix{font-size:12px;color:var(--muted)}
@media (max-width:640px){.legend{margin-bottom:8px}.legend .lg{width:220px;font-size:16px}.legend .lg small{font-size:12px}}
.legend .ix i{display:inline-block;width:24px;border-top:2px dashed var(--line);vertical-align:3px;margin-right:6px}
.chart{position:relative}
.head{position:relative;height:30px;margin-left:var(--lab);font-size:13px;color:var(--muted)}
.head span{position:absolute;bottom:4px;white-space:nowrap}
.head b{font-family:var(--display);font-size:20px;color:var(--ink);font-weight:400}
.row{display:grid;grid-template-columns:var(--lab) minmax(0,1fr);align-items:center;height:40.4px}
.lab{text-align:right;padding-right:10px;font-weight:700;font-size:15px;line-height:1.1}
.lab small{display:block;margin-top:3px;font-weight:400;font-size:11px;color:var(--muted)}
.plot{position:relative;height:100%;border-left:1px solid var(--grid)}
.bar{position:absolute;top:7.2px;bottom:7.2px;left:0}
.ttm{background:var(--ttm)}
.fwd{background:var(--fwd);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;box-sizing:border-box}
.fwd.out{justify-content:flex-start}
/*.tick*/.x{position:absolute;top:3px;bottom:3px;width:3px;background:var(--ttmtxt)}
.logo{flex:none;margin-left:8px;vertical-align:middle}
.ttm.in{color:var(--ink);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;box-sizing:border-box}
.val{display:flex;align-items:center;position:absolute;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:var(--ttmtxt);white-space:nowrap}
.brk{position:absolute;top:2px;bottom:2px;width:8px;background:var(--bg);transform:skewX(-20deg)}
.vline{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--line);pointer-events:none}
.grid{position:absolute;top:0;bottom:0;border-left:1px dashed var(--grid);pointer-events:none}
.w{color:var(--muted);font-weight:400;font-size:11px;margin-left:6px}
.na{display:flex;align-items:center;position:absolute;top:50%;transform:translateY(-50%);left:6px;font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px}
.row.other .lab{color:var(--muted)}
.tk{font-weight:600}
.kb{color:var(--acc);font-weight:600;text-decoration:none}
.kb:hover{text-decoration:underline;text-underline-offset:2px}
.rk{font-weight:400;font-size:12px;color:var(--muted);margin-right:5px}

  else if(pe!=null){
    const big=pe>CAP;
    if(big) p+=`<div class="brk" style="left:calc(${x(CAP)}% - 26px)"></div><span class="val" style="left:calc(${x(CAP)}% + 6px)">${pe.toFixed(1)}${L}</span>`;
    else p+=`<span class="val" style="left:calc(${Math.max(x(pe),f!=null?x(f):0)}% + 6px)">${pe.toFixed(1)}${L}</span>`;
  }
  else if(f==null) p+=`<span class="na">无市盈率数据（亏损或未披露）${L}</span>`;
  else p+=`<span class="val" style="left:calc(${x(f)}% + 6px);color:var(--muted)">滚动：亏损${L}</span>`;
  body+=`<div class="row ${r.name==='其他'?'other':''}"><div class="lab">${r.name}<small>${r.href?`<a class="kb" href="${r.href}" target="_blank" title="打开研报知识库 ${r.tk} 页">${r.tk}</a>`:`<span class="tk">${r.tk}</span>`}<span class="w">${r.w}%</span></small></div><div class="plot">${p}</div></div>`;
});
c.innerHTML=h+`<div style="position:relative">${body}<div style="position:absolute;top:0;bottom:0;left:var(--lab);right:0;pointer-events:none"><div class="vline" style="left:${x(D.idx_fpe)}%"></div><div class="vline" style="left:${x(D.idx_pe)}%"></div></div></div>`;
// 标签列宽与图的水平位置：
// 桌面：整张图左移，使「美光科技」的「美」与标题 NDX100 的 N 左对齐（更长的标签如 CrowdStrike 会略微伸出到左侧）；
// 手机：标签列收窄到最长标签的宽度，给截断柱右侧的数值和 logo 腾出空间，避免横向溢出。
function fit(){
  const tw=n=>{const r=document.createRange();r.selectNodeContents(n);return r.getBoundingClientRect().width};
  const labs=[...c.querySelectorAll('.lab')];
  if(innerWidth<=760){
    const w=Math.max(...labs.flatMap(l=>[tw(l.firstChild),tw(l.querySelector('small'))]));
    c.style.setProperty('--lab',Math.ceil(w+10)+'px');c.style.marginLeft='';
  }else{
    c.style.setProperty('--lab','135px');
    const mu=labs.find(l=>l.firstChild.textContent==='美光科技');
    c.style.marginLeft=mu?-(135-10-tw(mu.firstChild))+'px':'';
  }
}
// 桌面：「纳指100」整体市盈率行与图例的顶边，对齐左侧 ARCHIVE 的顶边（ARCHIVE 位置不动，其余向它靠拢）。
// 手机上 ARCHIVE 是顶部横排，不做对齐。
function alignTop(){
  const sub=document.querySelector('.sub'),arch=document.querySelector('.hist .ht'),leg=document.querySelector('.legend'),sp=[...c.querySelectorAll('.head span')];
  sub.style.marginBottom='';sp.forEach(e=>e.style.bottom='');
  if(innerWidth<=760||!arch||!leg) return;
  const top=e=>e.getBoundingClientRect().top+scrollY;
  // ARCHIVE 是 sticky（top:40px），页面顶部时已被顶到距屏幕顶 40px 处；以页面顶部（未滚动）时的位置为准
  const hist=document.querySelector('.hist');
  const archTop=Math.max(top(document.querySelector('.page')),parseFloat(getComputedStyle(hist).top)||0)+arch.offsetTop;
  sub.style.marginBottom=(28+archTop-top(leg))+'px';       // 整块（图例 + 图）下移，让图例顶边 = ARCHIVE 顶边
  const d=top(sp[0])-archTop;                              // 纳指100 数值行与图例顶边相差的零头
  sp.forEach(e=>e.style.bottom=(4+d)+'px');
}
const fitAll=()=>{fit();alignTop()};
fitAll();addEventListener('resize',fitAll);document.fonts&&document.fonts.ready.then(fitAll);
document.getElementById('n').innerHTML=`说明：<br>1. 横轴上限 ${CAP} 倍。超出部分截断（斜断口），实际值标在柱外右侧。<br>2. 前瞻市盈率高于滚动市盈率时（谷歌、亚马逊），浅色柱画在深色柱上方：浅色段是滚动值，露出的深色段末端是前瞻值。<br>3. 纳指100 整体市盈率 = 成分股总市值 ÷ 总盈利（各股盈利 = 市值 ÷ 市盈率），按 finviz 列出的 ${D.n} 只成分计算，市值加权，非 QQQ 权重。亏损或无数据的成分不计入：滚动口径剔除 ${D.ex_pe} 只，前瞻口径剔除 ${D.ex_fpe} 只（含 SpaceX）。<br>4. 「其他」= 前 33 名以外成分的同口径汇总，权重 = 100% − 前 33 名权重之和。${D.rows.some(r=>r.href)?'<br>5. 蓝绿色的代码可点击，打开研报知识库中该标的的页面（谷歌 A / C 共用一页）。':''}<br>${D.rows.some(r=>r.href)?6:5}. CrowdStrike 滚动市盈率 7,426 倍、Palo Alto 791 倍，因 TTM 盈利接近零，不代表估值水平。`;
</script></body></html>
